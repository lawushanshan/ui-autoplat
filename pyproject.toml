[project]
name = "ui-autoplat"
version = "0.1.0"
description = "UI automation testing platform built on robocorp-tasks and robocorp-browser"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "robocorp-tasks>=4.0.0",
    "robocorp-browser>=2.3.4",
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
actions = ["robocorp-action-server>=0.3.0"]
allure = ["allure-pytest>=2.13"]
rpa = ["rpaframework>=28.0"]
excel = ["openpyxl>=3.1"]
rich = ["rich>=13.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.2",
]
all = [
    "ui-autoplat[actions,allure,excel,rich]",
]

[project.scripts]
autoplat = "ui_autoplat.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
