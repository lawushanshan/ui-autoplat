browser:
  browser_type: chromium
  headless: true
  screenshot: only-on-failure
  viewport:
    width: 1280
    height: 720
  locale: en-US
  timezone: America/New_York

execution:
  mode: in-process
  retries: 0
  timeout_per_test: 60

output:
  dir: ./output
  report_format: json

discovery:
  paths:
    - .
  file_pattern: "*task*.py"
